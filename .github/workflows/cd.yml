# CD: merge vào main (hoặc tag v*) -> build image API + web gắn tag commit SHA -> đẩy lên GHCR
# -> deploy trên máy server của nhóm (self-hosted runner, docker compose) -> smoke test qua URL
#    Tailscale Funnel công khai -> lỗi thì rollback về tag stable.
# Bật deploy bằng repository variable DEPLOY_ENABLED=true sau khi đã cài runner và khai báo secret (docs/deployment.md).
name: CD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # Tên owner phải viết thường (GHCR); job trên runner dùng thẳng giá trị này nên chạy được cả trên Windows.
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/brewlite-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/brewlite-web

jobs:
  build-push:
    name: Build + push image API và web (tag SHA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name lowercase
        run: |
          echo "API_IMAGE=${API_IMAGE,,}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=${WEB_IMAGE,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push API
        run: |
          docker build --build-arg GIT_SHA=${{ github.sha }} -t "$API_IMAGE:${{ github.sha }}" apps/api
          docker push "$API_IMAGE:${{ github.sha }}"
      - name: Build + push web (nhúng URL API production)
        run: |
          docker build --build-arg NEXT_PUBLIC_API_URL="${{ vars.API_URL || 'http://localhost:3001' }}" -t "$WEB_IMAGE:${{ github.sha }}" apps/web
          docker push "$WEB_IMAGE:${{ github.sha }}"

  deploy:
    name: Deploy production (máy server qua Tailscale Funnel)
    needs: build-push
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, brewlite-prod]
    environment:
      name: production
      url: ${{ vars.WEB_URL }}
    env:
      IMAGE_TAG: ${{ github.sha }}
      WEB_URL: ${{ vars.WEB_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Kéo image theo SHA
        run: docker compose -f docker-compose.prod.yml pull api web
      - name: Chạy bản mới (API tự chạy prisma migrate deploy khi khởi động)
        run: docker compose -f docker-compose.prod.yml up -d --wait

  smoke-test:
    name: Smoke test production
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Đợi /health trả đúng SHA, DB up
        run: |
          for i in $(seq 1 30); do
            body=$(curl -fsS "${{ vars.API_URL }}/health" || true)
            echo "$body" | jq -e --arg sha "${{ github.sha }}" '.status=="ok" and .db=="up" and .version==$sha' && exit 0
            sleep 10
          done
          echo "API chưa lên phiên bản ${{ github.sha }}: $body"; exit 1
      - name: /products có dữ liệu
        run: curl -fsS "${{ vars.API_URL }}/products" | jq -e 'length > 0'
      - name: Trang web mở được qua HTTPS
        run: curl -fsS -o /dev/null "${{ vars.WEB_URL }}/"

  mark-stable:
    name: Gắn tag stable cho image đã qua smoke test
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Image name lowercase
        run: |
          echo "API_IMAGE=${API_IMAGE,,}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=${WEB_IMAGE,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker buildx imagetools create -t "$API_IMAGE:stable" "$API_IMAGE:${{ github.sha }}"
          docker buildx imagetools create -t "$WEB_IMAGE:stable" "$WEB_IMAGE:${{ github.sha }}"

  rollback:
    name: Rollback về bản stable
    needs: [deploy, smoke-test]
    if: failure() && vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, brewlite-prod]
    env:
      IMAGE_TAG: stable
      WEB_URL: ${{ vars.WEB_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Chạy lại image stable
        run: |
          docker compose -f docker-compose.prod.yml pull api web
          docker compose -f docker-compose.prod.yml up -d --wait
