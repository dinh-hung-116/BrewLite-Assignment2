# CI chạy cho mọi PR vào main: Install -> Lint -> Unit Test -> Build cho từng app,
# sau đó integration test API với PostgreSQL thật. Job lỗi sẽ chặn merge (branch ruleset).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.app }} - install, lint, test, build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Lint
        run: npm run lint
      - name: Unit test
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

  integration:
    name: api - integration test (PostgreSQL)
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite
          POSTGRES_DB: brewlite_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U brewlite -d brewlite_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://brewlite:brewlite@localhost:5432/brewlite_test
      JWT_SECRET: ci-only-secret
      PAYMENT_PROVIDER: mock
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Migrate + seed
        run: npx prisma migrate deploy && npx prisma db seed
      - name: Integration test
        run: npm run test:e2e

  e2e:
    name: web - E2E Playwright (Pixel 7)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack (db + api + web)
        run: docker compose up -d --build --wait
      - name: Seed sample data
        run: docker compose run --rm api npx prisma db seed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Playwright
        working-directory: apps/web
        run: npm ci && npx playwright install --with-deps chromium
      - name: E2E
        working-directory: apps/web
        run: npx playwright test
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
      - name: Logs on failure
        if: failure()
        run: docker compose logs
