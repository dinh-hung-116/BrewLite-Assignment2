# BrewLite: PostgreSQL + API (NestJS) + Web (Next.js)
# Chạy:            docker compose up -d --build
# Dữ liệu mẫu:     docker compose run --rm api npx prisma db seed
# Web http://localhost:3000, API http://localhost:3001 (/health), DB localhost:5434

name: brewlite

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brewlite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brewlite}
      POSTGRES_DB: ${POSTGRES_DB:-brewlite_db}
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brewlite} -d ${POSTGRES_DB:-brewlite_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: ${API_IMAGE:-brewlite-api}:${IMAGE_TAG:-local}
    build:
      context: ./apps/api
      args:
        GIT_SHA: ${IMAGE_TAG:-local}
    env_file:
      - path: ./apps/api/.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-brewlite}:${POSTGRES_PASSWORD:-brewlite}@db:5432/${POSTGRES_DB:-brewlite_db}
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}
      PAYMENT_PROVIDER: mock
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-brewlite-web}:${IMAGE_TAG:-local}
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
