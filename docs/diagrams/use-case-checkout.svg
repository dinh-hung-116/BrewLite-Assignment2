@startuml use-case-checkout
left to right direction
skinparam shadowing false
actor "Khách hàng" as Customer
actor "Cổng thanh toán\n(VNPay sandbox / mô phỏng)" as Pay
rectangle "BrewLite - Đặt và thanh toán" {
  usecase "UC-07 Áp mã khuyến mãi" as UC07
  usecase "UC-06 Đặt đơn hàng" as UC06
  usecase "UC-13 Thanh toán lại" as UC13
  usecase "UC-08 Thanh toán đơn" as UC08
  usecase "UC-09 Xem xác nhận\nvà chi tiết đơn" as UC09
  usecase "UC-05 Đăng nhập" as UC05
  usecase "UC-18 Giữ chỗ nguyên liệu" as UC18
  usecase "UC-17 Cộng điểm thưởng" as UC17
}
Customer - -> UC06
Customer - -> UC08
Customer - -> UC13
Customer - -> UC09
UC07 ..> UC06 : <<extend>>\n(bước 3: nhập mã)
UC06 ..> UC05 : <<include>>
UC06 ..> UC18 : <<include>>
UC08 ..> UC06 : <<include>>
UC08 ..> UC17 : <<include>>
UC13 ..> UC08 : <<include>>
UC08 - -> Pay
note bottom of UC08
  Idempotency-Key cho mỗi lần bấm.
  Cổng mô phỏng: thẻ đuôi 0002 => thất bại (demo).
end note
@enduml

